[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "genrocket-dataconnect-examples"
version = "0.1.0"
description = "Python examples for GenRocket DataConnect REST and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",
  "ruff==0.16.10",
]

[project.scripts]
dataconnect-example = "genrocket_dataconnect.cli:main"
dataconnect-mcp-bridge = "genrocket_dataconnect.bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genrocket_dataconnect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["genrocket_dataconnect"]
