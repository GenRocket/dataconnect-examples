name: Protected live smoke test

on:
  workflow_dispatch:
    inputs:
      language:
        description: Client implementation to verify
        required: true
        type: choice
        options: [python, java, dotnet]
      protocol:
        description: DataConnect transport
        required: true
        type: choice
        options: [rest, mcp]

permissions:
  contents: read

concurrency:
  group: dataconnect-live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ inputs.language }} ${{ inputs.protocol }}
    runs-on: ubuntu-latest
    environment: dataconnect-live
    env:
      DATACONNECT_ORG_EXTERNAL_ID: ${{ secrets.DATACONNECT_ORG_EXTERNAL_ID }}
      DATACONNECT_CLIENT_EXTERNAL_ID: ${{ secrets.DATACONNECT_CLIENT_EXTERNAL_ID }}
      DATACONNECT_USER_EXTERNAL_ID: ${{ secrets.DATACONNECT_USER_EXTERNAL_ID }}
      DATACONNECT_ORG_API_KEY: ${{ secrets.DATACONNECT_ORG_API_KEY }}
      DATACONNECT_REST_BASE_URL: ${{ secrets.DATACONNECT_REST_BASE_URL }}
      DATACONNECT_MCP_URL: ${{ secrets.DATACONNECT_MCP_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        if: inputs.language == 'python'
        with:
          version: "0.11.2"
          python-version: "3.11"
      - name: Python three-row smoke
        if: inputs.language == 'python'
        working-directory: python
        run: uv run --locked dataconnect-example ${{ inputs.protocol }} explicit --loop-count 3

      - uses: actions/setup-java@v6
        if: inputs.language == 'java'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Java three-row smoke
        if: inputs.language == 'java'
        working-directory: java
        run: |
          ./mvnw -B -q -pl examples -am package
          java -jar examples/target/dataconnect-examples.jar ${{ inputs.protocol }} explicit --loop-count 3

      - uses: actions/setup-dotnet@v6
        if: inputs.language == 'dotnet'
        with:
          dotnet-version: "10.0.x"
      - name: .NET three-row smoke
        if: inputs.language == 'dotnet'
        working-directory: dotnet
        run: dotnet run --project src/GenRocket.DataConnect.Examples -- ${{ inputs.protocol }} explicit --loop-count 3
